name: sdlc checkpoint
on: { pull_request: {} }
permissions: { contents: read, pull-requests: write }
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      # Pinned by `sdlc init` to the commit recorded in .sdlc/lock.json.
      # Configured ref: deploy-to-azure
      - run: npx --yes github:alex-struk/agentic-sdlc#bba2992b7a25b8773978e1179bf335f6adb51843 checks --json
